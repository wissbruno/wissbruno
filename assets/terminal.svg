<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" fill="none">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="900" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#a78bfa" stop-opacity=".25"/>
      <stop offset="1" stop-color="#34d399" stop-opacity=".6"/>
    </linearGradient>
    <clipPath id="c1"><rect x="30" y="80" height="30" width="0"><animate attributeName="width" from="0" to="120" begin="0.4s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="30" y="140" height="30" width="0"><animate attributeName="width" from="0" to="190" begin="1.7s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="30" y="200" height="30" width="0"><animate attributeName="width" from="0" to="150" begin="3.1s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="30" y="260" height="30" width="0"><animate attributeName="width" from="0" to="220" begin="4.5s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <style>
      .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace; font-size: 15px; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="378" rx="16" fill="#0b0f19" stroke="url(#border)" stroke-width="1.5"/>
  <path d="M1 17C1 8.2 8.2 1 17 1H883C891.8 1 899 8.2 899 17V46H1V17Z" fill="#111827"/>
  <circle cx="26" cy="24" r="6.5" fill="#ff5f57"/>
  <circle cx="48" cy="24" r="6.5" fill="#febc2e"/>
  <circle cx="70" cy="24" r="6.5" fill="#28c840"/>
  <text x="450" y="29" text-anchor="middle" class="mono" font-size="13" fill="#64748b">bruno@wiss: ~/sobre-mim</text>

  <g class="mono">
    <!-- 1 -->
    <text x="34" y="100" clip-path="url(#c1)"><tspan fill="#34d399">❯</tspan> <tspan fill="#e2e8f0">whoami</tspan></text>
    <text x="34" y="128" fill="#cbd5e1" opacity="0">Bruno Wiss — estudante de <tspan fill="#a78bfa">Sistemas de Informação</tspan> @ Anhembi Morumbi
      <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.3s" fill="freeze"/></text>

    <!-- 2 -->
    <text x="34" y="160" clip-path="url(#c3)"><tspan fill="#34d399">❯</tspan> <tspan fill="#e2e8f0">cat cargo.txt</tspan></text>
    <text x="34" y="188" fill="#cbd5e1" opacity="0">Analista de Logística Jr. — <tspan fill="#22d3ee">Torre de Controle · Dados &amp; Automação</tspan> @ Suzano
      <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.3s" fill="freeze"/></text>

    <!-- 3 -->
    <text x="34" y="220" clip-path="url(#c5)"><tspan fill="#34d399">❯</tspan> <tspan fill="#e2e8f0">ls ./foco</tspan></text>
    <text x="34" y="248" opacity="0"><tspan fill="#22d3ee">engenharia-de-dados/</tspan>   <tspan fill="#a78bfa">back-end/</tspan>   <tspan fill="#34d399">ia-aplicada/</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="3.9s" dur="0.3s" fill="freeze"/></text>

    <!-- 4 -->
    <text x="34" y="280" clip-path="url(#c7)"><tspan fill="#34d399">❯</tspan> <tspan fill="#e2e8f0">echo $FILOSOFIA</tspan></text>
    <text x="34" y="308" fill="#fde68a" opacity="0">"Não basta escrever código. É preciso construir soluções que gerem impacto real."
      <animate attributeName="opacity" from="0" to="1" begin="5.5s" dur="0.4s" fill="freeze"/></text>

    <!-- prompt final -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="6.1s" dur="0.1s" fill="freeze"/>
      <text x="34" y="344"><tspan fill="#34d399">❯</tspan></text>
      <rect x="54" y="331" width="9" height="17" fill="#22d3ee" class="cursor"/>
    </g>
  </g>
</svg>

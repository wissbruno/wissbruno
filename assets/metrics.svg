<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" fill="none">
  <defs>
    <clipPath id="band"><rect x="0" y="48" width="900" height="54"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .num { font-size: 44px; font-weight: 800; }
      .card { animation: in .8s cubic-bezier(.2,.8,.2,1) both; }
      .k2 { animation-delay: .15s } .k3 { animation-delay: .3s } .k4 { animation-delay: .45s }
      @keyframes in { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
    </style>
  </defs>

  <g class="sans">
    <!-- 30+ -->
    <g class="card">
      <rect x="1" y="1" width="208" height="188" rx="16" fill="#0b0f19" stroke="#22d3ee" stroke-opacity=".35"/>
      <g clip-path="url(#band)" class="num" fill="#22d3ee" text-anchor="middle">
        <g>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -520" begin="0.3s" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
          <text><tspan x="79" y="88">0</tspan><tspan x="79" y="140">1</tspan><tspan x="79" y="192">2</tspan><tspan x="79" y="244">3</tspan><tspan x="79" y="296">4</tspan><tspan x="79" y="348">5</tspan><tspan x="79" y="400">6</tspan><tspan x="79" y="452">7</tspan><tspan x="79" y="504">8</tspan><tspan x="79" y="556">9</tspan><tspan x="79" y="608">3</tspan></text>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -520" begin="0.3s" dur="2.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
          <text><tspan x="107" y="88">0</tspan><tspan x="107" y="140">1</tspan><tspan x="107" y="192">2</tspan><tspan x="107" y="244">3</tspan><tspan x="107" y="296">4</tspan><tspan x="107" y="348">5</tspan><tspan x="107" y="400">6</tspan><tspan x="107" y="452">7</tspan><tspan x="107" y="504">8</tspan><tspan x="107" y="556">9</tspan><tspan x="107" y="608">0</tspan></text>
        </g>
      </g>
      <text x="122" y="88" class="num" fill="#22d3ee">+</text>
      <text x="105" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">projetos entregues</text>
      <text x="105" y="147" text-anchor="middle" font-size="12" fill="#64748b">em 11 meses</text>
      <rect x="20" y="164" width="170" height="5" rx="2.5" fill="#ffffff" fill-opacity=".06"/>
      <rect x="20" y="164" width="0" height="5" rx="2.5" fill="#22d3ee"><animate attributeName="width" to="170" begin="0.3s" dur="2.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></rect>
    </g>

    <!-- 90%+ -->
    <g class="card k2">
      <rect x="231" y="1" width="208" height="188" rx="16" fill="#0b0f19" stroke="#34d399" stroke-opacity=".35"/>
      <g clip-path="url(#band)" class="num" fill="#34d399" text-anchor="middle">
        <g>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -520" begin="0.5s" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
          <text><tspan x="296" y="88">0</tspan><tspan x="296" y="140">1</tspan><tspan x="296" y="192">2</tspan><tspan x="296" y="244">3</tspan><tspan x="296" y="296">4</tspan><tspan x="296" y="348">5</tspan><tspan x="296" y="400">6</tspan><tspan x="296" y="452">7</tspan><tspan x="296" y="504">8</tspan><tspan x="296" y="556">9</tspan><tspan x="296" y="608">9</tspan></text>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -520" begin="0.5s" dur="2.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
          <text><tspan x="324" y="88">0</tspan><tspan x="324" y="140">1</tspan><tspan x="324" y="192">2</tspan><tspan x="324" y="244">3</tspan><tspan x="324" y="296">4</tspan><tspan x="324" y="348">5</tspan><tspan x="324" y="400">6</tspan><tspan x="324" y="452">7</tspan><tspan x="324" y="504">8</tspan><tspan x="324" y="556">9</tspan><tspan x="324" y="608">0</tspan></text>
        </g>
      </g>
      <text x="339" y="88" class="num" fill="#34d399">%+</text>
      <text x="335" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">menos processo manual</text>
      <text x="335" y="147" text-anchor="middle" font-size="12" fill="#64748b">nas rotinas automatizadas</text>
      <rect x="250" y="164" width="170" height="5" rx="2.5" fill="#ffffff" fill-opacity=".06"/>
      <rect x="250" y="164" width="0" height="5" rx="2.5" fill="#34d399"><animate attributeName="width" to="153" begin="0.5s" dur="2.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></rect>
    </g>

    <!-- 7 -->
    <g class="card k3">
      <rect x="461" y="1" width="208" height="188" rx="16" fill="#0b0f19" stroke="#a78bfa" stroke-opacity=".35"/>
      <g clip-path="url(#band)" class="num" fill="#a78bfa" text-anchor="middle">
        <g>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -520" begin="0.7s" dur="2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
          <text><tspan x="565" y="88">0</tspan><tspan x="565" y="140">1</tspan><tspan x="565" y="192">2</tspan><tspan x="565" y="244">3</tspan><tspan x="565" y="296">4</tspan><tspan x="565" y="348">5</tspan><tspan x="565" y="400">6</tspan><tspan x="565" y="452">7</tspan><tspan x="565" y="504">8</tspan><tspan x="565" y="556">9</tspan><tspan x="565" y="608">7</tspan></text>
        </g>
      </g>
      <text x="565" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">equipes atendidas</text>
      <text x="565" y="147" text-anchor="middle" font-size="12" fill="#64748b">usando as soluções</text>
      <rect x="480" y="164" width="170" height="5" rx="2.5" fill="#ffffff" fill-opacity=".06"/>
      <rect x="480" y="164" width="0" height="5" rx="2.5" fill="#a78bfa"><animate attributeName="width" to="119" begin="0.7s" dur="2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></rect>
    </g>

    <!-- 10+ -->
    <g class="card k4">
      <rect x="691" y="1" width="208" height="188" rx="16" fill="#0b0f19" stroke="#fbbf24" stroke-opacity=".35"/>
      <g clip-path="url(#band)" class="num" fill="#fbbf24" text-anchor="middle">
        <g>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -520" begin="0.9s" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
          <text><tspan x="781" y="88">0</tspan><tspan x="781" y="140">1</tspan><tspan x="781" y="192">2</tspan><tspan x="781" y="244">3</tspan><tspan x="781" y="296">4</tspan><tspan x="781" y="348">5</tspan><tspan x="781" y="400">6</tspan><tspan x="781" y="452">7</tspan><tspan x="781" y="504">8</tspan><tspan x="781" y="556">9</tspan><tspan x="781" y="608">1</tspan></text>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -520" begin="0.9s" dur="2.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
          <text><tspan x="809" y="88">0</tspan><tspan x="809" y="140">1</tspan><tspan x="809" y="192">2</tspan><tspan x="809" y="244">3</tspan><tspan x="809" y="296">4</tspan><tspan x="809" y="348">5</tspan><tspan x="809" y="400">6</tspan><tspan x="809" y="452">7</tspan><tspan x="809" y="504">8</tspan><tspan x="809" y="556">9</tspan><tspan x="809" y="608">0</tspan></text>
        </g>
      </g>
      <text x="824" y="88" class="num" fill="#fbbf24">+</text>
      <text x="795" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">tecnologias</text>
      <text x="795" y="147" text-anchor="middle" font-size="12" fill="#64748b">em produção</text>
      <rect x="710" y="164" width="170" height="5" rx="2.5" fill="#ffffff" fill-opacity=".06"/>
      <rect x="710" y="164" width="0" height="5" rx="2.5" fill="#fbbf24"><animate attributeName="width" to="136" begin="0.9s" dur="2.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></rect>
    </g>
  </g>
</svg>

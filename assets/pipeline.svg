<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" fill="none">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace; }
      .dash { stroke-dasharray: 6 8; animation: dash 1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -14 } }
      .node rect { stroke-opacity: .25; animation: lit 3s ease-in-out infinite; }
      .n2 rect { animation-delay: .6s } .n3 rect { animation-delay: 1.2s } .n4 rect { animation-delay: 1.8s } .n5 rect { animation-delay: 2.4s }
      @keyframes lit { 0%,100% { stroke-opacity: .25 } 12% { stroke-opacity: 1 } 35% { stroke-opacity: .25 } }
      .node { animation: pop .8s cubic-bezier(.2,.8,.2,1) both; }
      .n2 { animation-delay: .1s } .n3 { animation-delay: .2s } .n4 { animation-delay: .3s } .n5 { animation-delay: .4s }
      @keyframes pop { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="238" rx="16" fill="#0b0f19" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="30" y="40" class="mono" font-size="13" fill="#64748b">// do dado bruto à decisão — como eu entrego valor</text>

  <!-- trilho -->
  <path id="rail" d="M20 130H880" stroke="url(#flow)" stroke-opacity=".5" stroke-width="2" class="dash"/>

  <!-- pacotes de dados -->
  <g filter="url(#glow)">
    <circle r="5" fill="#22d3ee"><animateMotion dur="3s" repeatCount="indefinite" path="M20 130H880"/></circle>
    <circle r="4" fill="#a78bfa"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M20 130H880"/></circle>
    <circle r="5" fill="#34d399"><animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M20 130H880"/></circle>
  </g>

  <g class="sans">
    <g class="node n1">
      <rect x="25" y="86" width="140" height="88" rx="14" fill="#111827" stroke="#22d3ee" stroke-width="1.5"/>
      <g stroke="#22d3ee" stroke-width="2" fill="none"><ellipse cx="95" cy="104" rx="11" ry="4"/><path d="M84 104v14c0 2.2 4.9 4 11 4s11-1.8 11-4v-14M84 111c0 2.2 4.9 4 11 4s11-1.8 11-4"/></g>
      <text x="95" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">Fontes</text>
      <text x="95" y="162" text-anchor="middle" font-size="11" fill="#94a3b8">SAP S/4HANA · OTM</text>
    </g>
    <g class="node n2">
      <rect x="198" y="86" width="140" height="88" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
      <g stroke="#38bdf8" stroke-width="2" fill="none"><circle cx="268" cy="112" r="6"/><circle cx="268" cy="112" r="11" stroke-dasharray="4 3.2"><animateTransform attributeName="transform" type="rotate" from="0 268 112" to="360 268 112" dur="6s" repeatCount="indefinite"/></circle></g>
      <text x="268" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">Pipelines</text>
      <text x="268" y="162" text-anchor="middle" font-size="11" fill="#94a3b8">Python · SQL · GCP</text>
    </g>
    <g class="node n3">
      <rect x="380" y="86" width="140" height="88" rx="14" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="450" y="119" text-anchor="middle" font-size="20" font-weight="700" fill="#a78bfa" class="mono">{ }</text>
      <text x="450" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">APIs</text>
      <text x="450" y="162" text-anchor="middle" font-size="11" fill="#94a3b8">FastAPI · Node.js</text>
    </g>
    <g class="node n4">
      <rect x="562" y="86" width="140" height="88" rx="14" fill="#111827" stroke="#818cf8" stroke-width="1.5"/>
      <g stroke="#818cf8" stroke-width="2" fill="none"><rect x="619" y="101" width="26" height="17" rx="3"/><path d="M627 124h10M632 118v6"/></g>
      <text x="632" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">Interfaces</text>
      <text x="632" y="162" text-anchor="middle" font-size="11" fill="#94a3b8">React · Power Apps</text>
    </g>
    <g class="node n5">
      <rect x="735" y="86" width="140" height="88" rx="14" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
      <path d="M805 99c1.5 7 4 9.5 11 11-7 1.5-9.5 4-11 11-1.5-7-4-9.5-11-11 7-1.5 9.5-4 11-11z" fill="#34d399"><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></path>
      <text x="805" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">IA Generativa</text>
      <text x="805" y="162" text-anchor="middle" font-size="11" fill="#94a3b8">OpenAI · Agentes</text>
    </g>
  </g>

  <text x="450" y="212" text-anchor="middle" class="sans" font-size="13" fill="#94a3b8">Automações logísticas  ·  Portais internos full stack  ·  Pipelines de dados  ·  Integrações com IA</text>
</svg>
